{% extends 'auth/base.html' %}


{% block body %}

<h1>{{request.user}}-{{request.user.user_types}}</h1>
{% for i in form %}
<div class="card" style="width: 18rem;">
  <div class="card-body">
    <h5 class="card-title">{{i.name}}</h5>
    <p class="card-text">{{i.email}}</p>
    <p class="card-text">{{i.skill}}</p>
    <a href="#" class="btn btn-primary">{{btn}}</a>
  </div>
</div>
{% endfor %}
{% endblock body %}
